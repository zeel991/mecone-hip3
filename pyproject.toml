[project]
name = "mecone-hip3"
version = "0.1.0"
description = "Mecone indices as Hyperliquid HIP-3 perps: listing-readiness report and dry-run oracle relayer"
readme = "README.md"
authors = [
    { name = "zeel991", email = "darjizeel587@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "hyperliquid-python-sdk>=0.24.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
]

[project.scripts]
mecone-hip3 = "mecone_hip3.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
